# Publishes neru-cli to npm for a release that already exists, without rebuilding the apps.
# The Release workflow does the same after each tag; run this one by hand to (re)publish a tag.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.5.0
        required: true

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish neru-cli
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node scripts/sync-version.mjs "$TAG"
          dist_tag=latest
          case "$TAG" in *-*) dist_tag=next ;; esac
          npm publish --provenance --access public --tag "$dist_tag"

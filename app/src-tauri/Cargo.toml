[package]
name = "neru"
version = "0.10.0"
description = "A calm, local-first coding agent"
authors = ["Neru"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"
default-run = "neru"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "neru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neru"
path = "src/main.rs"

[[bin]]
name = "neru-cli"
path = "src/bin/neru-cli.rs"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
ignore = "0.4"
regex = "1"
regex-syntax = "0.8"
crossterm = "0.28"
similar = "3"
sha2 = "0.10"
portable-pty = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process", "sync", "macros", "io-util", "net", "fs", "rt", "signal"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Neru Remote (remote.rs): the paired phone's encrypted WebSocket.
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
percent-encoding = "2"
if-addrs = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

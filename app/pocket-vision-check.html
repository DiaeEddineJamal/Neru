<!doctype html><html lang="en"><meta charset="utf-8"><title>Pocket Lab vision check</title>
<h1>Pocket Lab vision check</h1><p>Local test: copy the Magic Touch model and a photo into public/__probe__/model.task and image.png.</p>
<button>Check CPU</button><button>Check GPU</button><pre role="status">Ready</pre><img alt="Test cutout" style="max-width:600px;background:#ccd">
<script type="module">
import { magicTouch } from '/src/lib/pocket/magic-touch.ts';
for (const button of document.querySelectorAll('button')) button.onclick = async () => {
  const status = document.querySelector('pre'); status.textContent='Running…';
  try {
    const response=await fetch('/__probe__/model.task'); if(!response.ok)throw Error('Missing model fixture');
    const source=new Image();source.src='/__probe__/image.png';await source.decode();
    const canvas=document.createElement('canvas');canvas.width=source.width;canvas.height=source.height;canvas.getContext('2d').drawImage(source,0,0);
    const result=await magicTouch(await response.arrayBuffer(),canvas.toDataURL(),.5,.53,button.textContent.includes('GPU')?'gpu':'cpu');
    const image=document.querySelector('img');image.src=result;await image.decode();canvas.width=image.width;canvas.height=image.height;canvas.getContext('2d').drawImage(image,0,0,canvas.width,canvas.height);
    const data=canvas.getContext('2d').getImageData(0,0,canvas.width,canvas.height).data;
    let visible=0,transparent=0;for(let i=3;i<data.length;i+=4){if(data[i]>192)visible++;if(data[i]<16)transparent++;}
    if(!visible||!transparent)throw Error(`Mask check: retained=${visible}, transparent=${transparent}, dimensions=${canvas.width}x${canvas.height}`);
    status.textContent=`PASS: ${button.textContent}; ${visible} retained pixels; ${transparent} transparent pixels`;
  }catch(error){status.textContent='FAIL: '+error.message;}
};
</script></html>
